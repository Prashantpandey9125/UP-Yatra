<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>UP Yatra | Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='admin.css') }}">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                <span>UP</span> Yatra
            </div>

            <p class="admin-label">
                ADMIN PANEL
            </p>

            <h1>
                Welcome Back 👋
            </h1>

            <p class="login-subtitle">
                Login to manage your UP Yatra website.
            </p>


            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}


            <form method="POST"
                  action="{{ url_for('admin_login') }}">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button type="submit"
                        class="login-btn">

                    Login to Dashboard →

                </button>

            </form>


            <a href="{{ url_for('home') }}"
               class="back-home">

                ← Back to UP Yatra

            </a>

        </div>

    </div>

</body>
</html>
